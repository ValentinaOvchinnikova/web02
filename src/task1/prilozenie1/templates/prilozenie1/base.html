<!--Объявила тип документа-->
<!DOCTYPE html>
<!--Корневой элемент с указанием языка-->
<html lang="en">
<!--Служебная инфа которая не будет отображаться на сайте -->
<head>
<!--    Настройки кодировки-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--    Заголовок на вкладке браузера-->
    <title>Clinical Trials</title>
<!--    СSS фреймворк бутстрап-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!--Видимое содержимое страницы-->
<body>
    <div class="container">
<!--        Место для вставки содержимого других шаблонов-->
        {% block content %}
        {% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
