<!DOCTYPE html>
<html>
<head>
    <title>Добавление пациента</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Добавление нового пациента</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
                {{ form.name }}
            </div>
            <div class="mb-3">
                <label for="{{ form.age.id_for_label }}" class="form-label">{{ form.age.label }}</label>
                {{ form.age }}
            </div>
            <div class="mb-3">
                <label for="{{ form.gender.id_for_label }}" class="form-label">{{ form.gender.label }}</label>
                {{ form.gender }}
            </div>
            <div class="mb-3">
                <label for="{{ form.conditions.id_for_label }}" class="form-label">{{ form.conditions.label }}</label>
                {{ form.conditions }}
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>
</body>
</html>
