<!DOCTYPE html>
<html>
<head>
    <title>Успешно</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="alert alert-success">
            <h2>Данные успешно сохранены</h2>
            <p><strong>Пациент:</strong> {{ patient.name }} (ID: {{ patient.patient_id }})</p>
            <p><strong>Исследование:</strong> {{ trial }}</p>
            <p><strong>Препарат:</strong> {{ drug|default:"Не указан" }}</p>
            <p><strong>Оценка состояния:</strong> {{ score }} ({{ analysis }})</p>
            <div class="alert {% if 'normal' in message %}alert-info{% else %}alert-warning{% endif %} mt-3">{{message}}
            </div>

            <a href="/" class="btn btn-primary">Вернуться к форме</a>
        </div>
    </div>
</body>
</html>
